; SprintJumpStamina.ini - stamina charged when the player jumps (not on a horse, not in god mode).
; A jump never takes more stamina than you have left.


[General]

; Write SprintJumpStamina.log (settings and every jump's cost); false writes no log file.
EnableLogging=false


[Cost]

; Seconds of your current sprint drain charged per sprint-jump (7/s unarmoured, +2% per point of worn weight).
SprintJumpSeconds=1.0

; Scales the worn-weight part of that drain for sprint-jumps (1.0 = same as sprinting, lower = armour matters less).
SprintJumpWeightScale=0.6

; Flat stamina added to every sprint-jump.
SprintJumpFlat=0

; Stamina charged for a jump while not sprinting (0 = free).
NormalJump=0
